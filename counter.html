<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Our Kitchen – counter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#fffdf5;--ink:#14342b;--muted:#5b7269;--line:#14342b26;--yellow:#ffc82e;--green:#14342b;--red:#b3261e;--card:#fff;--btn-ink:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0f1f1a;--ink:#f2efe2;--muted:#a6b8af;--line:#f2efe233;--card:#172a23;--green:#ffc82e;--btn-ink:#14342b}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'DM Sans',system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid #2f7cff;outline-offset:2px}
.btn{background:var(--green);color:var(--btn-ink);border:0;border-radius:12px;padding:14px 18px;font-weight:700;cursor:pointer;width:100%}
.btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--red);border:1.5px solid var(--line)}
.btn.sm{width:auto;padding:6px 12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.hidden{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--yellow)}
.box{background:var(--card);padding:32px;border-radius:20px;width:100%;max-width:380px;display:grid;gap:14px}
label{display:grid;gap:4px;font-weight:500;font-size:.95rem}
input{border:1.5px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);width:100%}
.note{color:var(--muted);font-size:.85rem;margin:0}.err{color:var(--red);font-size:.9rem;margin:0;min-height:1.2em}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:var(--card)}
.who{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:.9rem}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;padding:20px;max-width:1200px;margin:0 auto}
h2.cat{font-size:1.1rem;margin:18px 0 10px}h2.cat:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.dish{min-height:84px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.dish:active{transform:scale(.97)}
.dish b{font-size:1rem;line-height:1.2}.dish span{color:var(--muted);font-size:.9rem}
.dish[disabled]{opacity:.4;cursor:not-allowed}
.side{position:sticky;top:16px;align-self:start;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:8px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:transparent;cursor:pointer;font-weight:700}
.total{display:flex;justify-content:space-between;font-size:1.3rem;font-weight:700}
.empty{color:var(--muted);margin:0}
.ord{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;padding:8px 0;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer;color:inherit}
.st{font-size:.75rem;border-radius:6px;padding:1px 8px;background:var(--line)}
.st.paid{background:#1f7a4d;color:#fff}.st.cancelled{background:var(--red);color:#fff}
#rcpt{border:0;border-radius:16px;padding:20px;width:min(360px,94vw);background:#fff;color:#000}
#rcpt::backdrop{background:#0008}
#receipt{font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;color:#000}
#receipt h2{font:800 20px 'Bricolage Grotesque',sans-serif;text-align:center;margin-bottom:2px}
#receipt .c{text-align:center}
#receipt hr{border:0;border-top:1px dashed #000;margin:8px 0}
#receipt .r{display:flex;justify-content:space-between;gap:8px}
.rbtns{display:flex;gap:10px;margin-top:16px}
@media print{
  @page{size:80mm auto;margin:3mm}
  body{background:#fff}
  #app,#login,#toast{display:none!important}
  #rcpt{position:static;width:100%;padding:0;margin:0;box-shadow:none}
  #rcpt::backdrop{display:none}
  .rbtns{display:none}
}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#14342b;color:#fff;padding:12px 20px;border-radius:999px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}
#toast.on{opacity:1}
.ordwrap{display:flex;gap:6px;align-items:center}.ordwrap .ord{flex:1;min-width:0}.ordwrap .btn{flex:none}
@media(max-width:860px){.layout{grid-template-columns:1fr}.side{position:static}}
</style>
</head>
<body>

<div id="login" class="hidden">
  <div class="box">
    <h1>Our Kitchen counter</h1>
    <p class="note">Staff sign in</p>
    <label>Email<input id="em" type="email" autocomplete="username"></label>
    <label>Password<input id="pw" type="password" autocomplete="current-password"></label>
    <p class="err" id="lerr" role="alert"></p>
    <button class="btn" id="signin">Sign in</button>
  </div>
</div>

<div id="app" class="hidden">
  <header><h1>Counter</h1><div class="who"><label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="auto" style="width:auto"> Auto-print</label><span id="who"></span><button class="btn sec sm" id="signout">Sign out</button></div></header>
  <div class="layout">
    <main id="menu" aria-label="Menu"></main>
    <aside class="side">
      <div class="card" id="ticket"></div>
      <div class="card"><h3>Recent orders</h3><div id="recent"></div></div>
    </aside>
  </div>
</div>
<dialog id="rcpt"><div id="receipt"></div><div class="rbtns"><button class="btn" id="rprint">Print receipt</button><button class="btn sec" id="rclose">Close</button></div></dialog>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB_URL='https://srkzouqducveytskfuuy.supabase.co';
const SB_KEY='sb_publishable_1nAtf0inkjIjNcudcPf-gw_QW7jCfUM';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kes=n=>'KES '+Number(n).toLocaleString('en-KE');
let cats=[],dishes=[],cart={},order=null,busy=false,toastT,poll=null,note='';

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}
function show(v){$('login').classList.toggle('hidden',v!=='login');$('app').classList.toggle('hidden',v!=='app')}

/* Sign in: owner or cashier only */
async function enter(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){show('login');return}
  const {data}=await sb.from('staff').select('role').eq('user_id',session.user.id).maybeSingle();
  if(!data||!['owner','cashier'].includes(data.role)){await sb.auth.signOut();$('lerr').textContent='This account is not set up as staff.';show('login');return}
  $('who').textContent=session.user.email+' ('+data.role+')';show('app');await load();
}
$('signin').onclick=async()=>{
  $('lerr').textContent='';const b=$('signin');b.disabled=true;
  const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  b.disabled=false;if(error){$('lerr').textContent='Wrong email or password.';return}
  $('pw').value='';enter();
};
$('signout').onclick=async()=>{await sb.auth.signOut();cart={};order=null;show('login')};
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')show('login')});

/* Data */
async function load(){
  const [c,d]=await Promise.all([sb.from('categories').select('*').order('position'),sb.from('dishes').select('*').order('position')]);
  if(c.error||d.error){toast((c.error||d.error).message);return}
  cats=c.data;dishes=d.data;renderMenu();renderTicket();loadRecent();
}
async function loadRecent(){
  const {data,error}=await sb.from('orders').select('id,order_no,status,total_kes,created_at,paid_at').order('created_at',{ascending:false}).limit(12);
  if(error){$('recent').innerHTML='<p class="empty">Could not load orders.</p>';return}
  $('recent').innerHTML=data.length?data.map(o=>`<div class="ordwrap"><button class="ord" data-rc="${o.id}"><span>#${o.order_no} · ${new Date(o.created_at).toLocaleTimeString('en-KE',{hour:'2-digit',minute:'2-digit'})}</span><span>${kes(o.total_kes)} <span class="st ${o.status}">${o.status}</span></span></button>${o.status==='paid'&&o.paid_at&&Date.now()-new Date(o.paid_at)<10*60000?`<button class="btn danger sm" data-voidrow="${o.id}" data-no="${o.order_no}">Void</button>`:''}</div>`).join(''):'<p class="empty">No orders yet.</p>';
}

/* Menu and ticket */
function renderMenu(){
  $('menu').innerHTML=cats.map(c=>{
    const it=dishes.filter(d=>d.category_id===c.id);
    return it.length?`<h2 class="cat">${esc(c.name)}</h2><div class="grid">`+it.map(d=>`<button class="dish" data-add="${d.id}" ${d.sold_out||order?'disabled':''}><b>${esc(d.name)}</b><span>${d.sold_out?'Sold out':kes(d.price_kes)}</span></button>`).join('')+'</div>':'';
  }).join('')||'<p class="empty">No menu items yet. Add some in the admin page.</p>';
}
const lines=()=>Object.entries(cart).map(([id,q])=>({d:dishes.find(x=>x.id===id),q})).filter(l=>l.d);
const total=()=>lines().reduce((s,l)=>s+l.d.price_kes*l.q,0);

function renderTicket(){
  const t=$('ticket');
  if(order&&order.status==='pending'){
    t.innerHTML=`<h3>Order #${order.order_no}</h3><div class="total"><span>To pay</span><span>${kes(order.total_kes)}</span></div>
      <p class="empty">Waiting for the customer to enter their M-Pesa PIN…</p>
      <button class="btn sec" data-stop="1">Stop waiting</button>
      <button class="btn danger" data-cancel="1">Cancel order</button>`;
    return;
  }
  if(order){
    t.innerHTML=`<h3>Order #${order.order_no}</h3><div class="total"><span>To pay</span><span>${kes(order.total_kes)}</span></div>
      ${note?`<p class="err">${esc(note)}</p>`:''}
      <label>Customer phone<input id="ph" type="tel" inputmode="tel" placeholder="07XX XXX XXX" value="${esc(order.phone||'')}"></label>
      <button class="btn" data-stk="1">Send M-Pesa prompt</button>
      <button class="btn sec" data-pay="cash">Paid in cash</button>
      <label>M-Pesa code (optional)<input id="rc" maxlength="15" placeholder="e.g. QGH7XXXXXX" autocapitalize="characters"></label>
      <button class="btn sec" data-pay="mpesa_manual">Paid by M-Pesa (manual)</button>
      <button class="btn danger" data-cancel="1">Cancel order</button>`;
    return;
  }
  const L=lines();
  t.innerHTML=`<h3>New order</h3>`+(L.length?L.map(l=>`<div class="line"><span>${esc(l.d.name)}<br><small>${kes(l.d.price_kes*l.q)}</small></span><span class="qty"><button data-dec="${l.d.id}" aria-label="Remove one ${esc(l.d.name)}">−</button><b>${l.q}</b><button data-inc="${l.d.id}" aria-label="Add one ${esc(l.d.name)}">+</button></span></div>`).join('')+
    `<div class="total"><span>Total</span><span>${kes(total())}</span></div><button class="btn" data-create="1">Take payment</button><button class="btn sec" data-clear="1">Clear</button>`:'<p class="empty">Tap a dish to add it.</p>');
}

/* Receipts */
async function showReceipt(orderId,autoPrint){
  const [o,i]=await Promise.all([sb.from('orders').select('*').eq('id',orderId).single(),sb.from('order_items').select('name,price_kes,qty').eq('order_id',orderId)]);
  if(o.error||i.error){toast('Could not load the receipt');return}
  const r=o.data,pm={cash:'Cash',mpesa_manual:'M-Pesa',mpesa_stk:'M-Pesa'}[r.payment_method]||'';
  const d=new Date(r.paid_at||r.created_at);
  $('receipt').innerHTML=`<h2>Our Kitchen</h2><div class="c">[Address and phone number]</div><hr>
    <div class="r"><span>Order #${r.order_no}</span><span>${d.toLocaleDateString('en-KE')} ${d.toLocaleTimeString('en-KE',{hour:'2-digit',minute:'2-digit'})}</span></div><hr>`+
    i.data.map(x=>`<div class="r"><span>${x.qty} x ${esc(x.name)}</span><span>${(x.qty*x.price_kes).toLocaleString('en-KE')}</span></div>`).join('')+
    `<hr><div class="r"><b>TOTAL</b><b>${kes(r.total_kes)}</b></div>`+
    (r.status==='paid'?`<div class="r"><span>Paid by</span><span>${pm}</span></div>`+(r.mpesa_receipt?`<div class="r"><span>M-Pesa ref</span><span>${esc(r.mpesa_receipt)}</span></div>`:''):`<div class="c"><b>${esc(r.status.toUpperCase())}</b></div>`)+
    `<hr><div class="c">Thank you for eating with us!</div>`;
  $('rcpt').showModal();
  if(autoPrint)setTimeout(()=>window.print(),300);
}
try{$('auto').checked=localStorage.getItem('kiki-autoprint')==='1'}catch(e){}
$('auto').onchange=()=>{try{localStorage.setItem('kiki-autoprint',$('auto').checked?'1':'0')}catch(e){}};

/* M-Pesa waiting */
function stopPoll(){clearInterval(poll);poll=null}
function startPoll(){
  stopPoll();let n=0;
  poll=setInterval(async()=>{
    n++;
    const {data}=await sb.from('orders').select('status,mpesa_result').eq('id',order.id).single();
    if(!data)return;
    if(data.status==='paid'){stopPoll();const rid=order.id;toast('Order #'+order.order_no+' paid by M-Pesa');order=null;cart={};note='';renderMenu();renderTicket();loadRecent();showReceipt(rid,$('auto').checked)}
    else if(data.status==='open'){stopPoll();note=data.mpesa_result||'The payment was not completed.';order.status='open';renderTicket();loadRecent()}
    else if(n>40){stopPoll();note='No answer yet. Check the customer phone or try again.';order.status='open';renderTicket()}
  },3000);
}

/* Actions */
async function rpc(name,args){
  if(busy)return null;busy=true;
  const {data,error}=await sb.rpc(name,args);busy=false;
  if(error){toast(error.message);return null}
  return Array.isArray(data)?data[0]:data;
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  const s=b.dataset;
  if(b.id==='rprint')window.print();
  if(b.id==='rclose')$('rcpt').close();
  if(s.rc)showReceipt(s.rc,false);
  if(s.voidrow){
    const reason=(prompt('Why is order #'+s.no+' being voided? (required)')||'').trim();
    if(reason.length<3){toast('A reason is required');return}
    if(!confirm('Void order #'+s.no+'? Give the customer their money back by hand.'))return;
    const o=await rpc('void_order',{p_order:s.voidrow,p_reason:reason});
    if(o){toast('Order #'+s.no+' voided');loadRecent()}
  }
  if(s.add&&!order){cart[s.add]=(cart[s.add]||0)+1;renderTicket()}
  if(s.inc){cart[s.inc]++;renderTicket()}
  if(s.dec){if(--cart[s.dec]<=0)delete cart[s.dec];renderTicket()}
  if(s.clear){cart={};renderTicket()}
  if(s.create){
    const items=lines().map(l=>({dish_id:l.d.id,qty:l.q}));
    const o=await rpc('create_order',{p_items:items});
    if(o){order=o;renderMenu();renderTicket();loadRecent()}
  }
  if(s.stk){
    const phone=($('ph').value||'').trim();
    if(!phone){toast('Enter the customer phone number');return}
    if(busy)return;busy=true;b.disabled=true;
    const {data,error}=await sb.functions.invoke('mpesa-stk',{body:{order_id:order.id,phone}});
    busy=false;
    if(error||!data||data.error){note=(data&&data.error)||(error&&error.message)||'Could not send the prompt.';renderTicket();return}
    note='';order.status='pending';order.phone=phone;renderTicket();startPoll();
  }
  if(s.stop){stopPoll();order.status='open';renderTicket()}
  if(s.pay){
    const o=await rpc('pay_order',{p_order:order.id,p_method:s.pay,p_receipt:s.pay==='mpesa_manual'?($('rc').value||null):null});
    if(o){stopPoll();note='';toast('Order #'+o.order_no+' paid');order=null;cart={};renderMenu();renderTicket();loadRecent();showReceipt(o.id,$('auto').checked)}
  }
  if(s.cancel&&confirm('Cancel this order?')){
    const o=await rpc('cancel_order',{p_order:order.id});
    if(o){stopPoll();note='';toast('Order cancelled');order=null;renderMenu();renderTicket();loadRecent()}
  }
});
enter();
</script>
</body>
</html>
