<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Order status</title>
<link rel="preconnect" href="https://srkzouqducveytskfuuy.supabase.co" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=DM+Sans:wght@400;700&display=swap">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#0f1f1a;color:#f2efe2;font:20px/1.3 'DM Sans',system-ui,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 32px;border-bottom:2px solid #f2efe222}
h1{font:800 clamp(1.6rem,3.5vw,2.6rem) 'Bricolage Grotesque',sans-serif;margin:0}
#clock{font-size:clamp(1.2rem,2.5vw,2rem);color:#a6b8af}
main{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
section{padding:24px 32px;overflow:hidden}
section+section{background:#ffc82e;color:#14342b}
h2{font:800 clamp(1.6rem,3.5vw,2.6rem) 'Bricolage Grotesque',sans-serif;margin:0 0 20px}
.nums{display:flex;flex-wrap:wrap;gap:16px}
.n{font:800 clamp(3rem,9vw,7rem)/1 'Bricolage Grotesque',sans-serif;min-width:1.6em;text-align:center;padding:.1em .25em;border-radius:20px;background:#f2efe214}
section+section .n{background:#14342b;color:#ffc82e}
.n.fresh{animation:pop 1.2s ease-out 3}
@keyframes pop{50%{transform:scale(1.15)}}
.empty{color:#a6b8af;font-size:1.2rem}section+section .empty{color:#14342b99}
#err{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#b3261e;color:#fff;padding:8px 16px;border-radius:999px;font-size:.9rem}
@media(max-width:700px){main{grid-template-columns:1fr}header{padding:14px 18px}section{padding:18px}}
@media(prefers-reduced-motion:reduce){.n.fresh{animation:none}}
</style>
</head>
<body>
<header><h1 id="name">Our Kitchen</h1><div id="clock" aria-hidden="true"></div></header>
<main>
  <section aria-live="polite"><h2>Preparing</h2><div class="nums" id="prep"></div></section>
  <section aria-live="polite"><h2>Ready to collect</h2><div class="nums" id="ready"></div></section>
</main>
<div id="err" hidden>Reconnecting…</div>
<script>
const SB_URL='https://srkzouqducveytskfuuy.supabase.co';
const SB_KEY='sb_publishable_1nAtf0inkjIjNcudcPf-gw_QW7jCfUM';
const H={apikey:SB_KEY,'Content-Type':'application/json'};
const $=id=>document.getElementById(id);
let prevReady=null;

fetch(`${SB_URL}/rest/v1/site_settings?id=eq.1&select=business_name`,{headers:H}).then(r=>r.json()).then(r=>{
  if(r[0]&&r[0].business_name){$('name').textContent=r[0].business_name;document.title=r[0].business_name+' – order status'}
}).catch(()=>{});

function tick(){$('clock').textContent=new Date().toLocaleTimeString('en-KE',{hour:'2-digit',minute:'2-digit'})}
tick();setInterval(tick,15000);

async function refresh(){
  try{
    const r=await fetch(`${SB_URL}/rest/v1/rpc/order_board`,{method:'POST',headers:H,body:'{}'});
    if(!r.ok)throw 0;
    const rows=await r.json();
    const prep=rows.filter(x=>x.kitchen_status!=='ready').map(x=>x.order_no);
    const ready=rows.filter(x=>x.kitchen_status==='ready').map(x=>x.order_no);
    $('prep').innerHTML=prep.length?prep.map(n=>`<div class="n">${n}</div>`).join(''):'<p class="empty">No orders cooking</p>';
    $('ready').innerHTML=ready.length?ready.map(n=>`<div class="n ${prevReady&&!prevReady.includes(n)?'fresh':''}">${n}</div>`).join(''):'<p class="empty">Nothing ready yet</p>';
    prevReady=ready;$('err').hidden=true;
  }catch(e){$('err').hidden=false}
}
refresh();setInterval(refresh,5000);
</script>
</body>
</html>
